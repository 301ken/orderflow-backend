spring.application.name=orderflow
# PostgreSQL Configuration (Commented out by default to allow H2 fallback if no env vars)
# spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/orderflow_db}
# spring.datasource.username=${DB_USERNAME:postgres}
# spring.datasource.password=${DB_PASSWORD:postgres}
# spring.datasource.driver-class-name=org.postgresql.Driver

# H2 Configuration for Local Run without Environment Variables
spring.datasource.url=${DB_URL:jdbc:h2:mem:orderflow_db;DB_CLOSE_DELAY=-1}
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=org.h2.Driver
spring.h2.console.enabled=true

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.orm.jdbc.bind=TRACE

security.user.name=${APP_USERNAME:admin}
security.user.password=${APP_PASSWORD:admin123}
security.regular-user.name=${APP_USER_USERNAME:user}
security.regular-user.password=${APP_USER_PASSWORD:user123}
security.jwt.secret=${JWT_SECRET:b3JkZXJmbG93LWp3dC1zZWNyZXQtbXVzdC1iZS0zMmJ5dGVzLXNpemVkLTAx}
security.jwt.expiration-seconds=${JWT_EXPIRATION_SECONDS:3600}

# Multipart upload limits for document storage
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Stripe payments (disabled by default -> NoopPaymentService fallback)
stripe.enabled=${STRIPE_ENABLED:false}
stripe.api-key=${STRIPE_API_KEY:}
stripe.webhook-secret=${STRIPE_WEBHOOK_SECRET:}
stripe.currency=${STRIPE_CURRENCY:usd}

# Firebase Authentication (disabled by default -> NoopFirebaseTokenVerifier fallback)
firebase.enabled=${FIREBASE_ENABLED:false}
firebase.credentials=${FIREBASE_CREDENTIALS:}

# AWS S3 document storage (disabled by default -> LocalDocumentStorageService fallback)
aws.s3.enabled=${AWS_S3_ENABLED:false}
aws.s3.bucket=${AWS_S3_BUCKET:}
aws.region=${AWS_REGION:us-east-1}
storage.local.base-dir=${STORAGE_LOCAL_DIR:${java.io.tmpdir}/orderflow-docs}